name: PHP Syntax and metadata
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l DWDWeather/module.php
          php -l libs/ForecastEngine.php
      - name: Validate metadata
        run: |
          php -r 'foreach (["library.json", "DWDWeather/module.json", "DWDWeather/form.json"] as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); }'
      - name: Run Symcon mock tests (without network)
        run: php tests/test_module.php
